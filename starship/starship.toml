palette = "dark-orchid"

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

format = """$character"""

right_format = """$directory$cmd_duration"""

# Dark Orchid — a Starship theme
#
# Copyright (c) 2026 — present by The Dark Orchid Maintainers
# Released under the MIT License — see LICENSE at the repository root.

# ---------------------------------------------------------------------------
# The prompt character
# ---------------------------------------------------------------------------

[character]
# The character you type against, after a command that succeeded
success_symbol = "[❯](bold accent)"
# The same character after a command that failed
error_symbol = "[❯](bold error)"
# Vim normal mode
vimcmd_symbol = "[❮](bold accent)"
# Vim visual mode
vimcmd_visual_symbol = "[❮](bold accent-peak)"
# Vim replace mode, which overwrites what is under the cursor
vimcmd_replace_symbol = "[❮](bold error)"
vimcmd_replace_one_symbol = "[❮](bold error)"

# ---------------------------------------------------------------------------
# Where you are
# ---------------------------------------------------------------------------

[directory]
# The working directory — the loudest thing in the prompt
style = "bold accent"
# The part of the path above the repository root
before_repo_root_style = "fg-muted"
# The repository root itself
repo_root_style = "bold accent"
# The marker on a directory you cannot write to
read_only_style = "warning"

[fill]
# The run of padding characters between a left and a right segment
style = "border"

# ---------------------------------------------------------------------------
# Version control
# ---------------------------------------------------------------------------

[git_branch]
# The current branch
style = "bold fg"

[git_commit]
# The commit hash on a detached HEAD, and the tag beside it
style = "fg-muted"

[git_state]
# An interrupted operation: rebase, merge, bisect, revert, cherry-pick
style = "bold error"

[git_status]
# Staged, modified, untracked, stashed, ahead and behind counts
style = "bold warning"

[git_metrics]
# Lines added in the working tree
added_style = "success"
# Lines deleted in the working tree
deleted_style = "error"

[hg_branch]
# The current Mercurial branch or bookmark
style = "bold fg"

[fossil_branch]
# The current Fossil branch
style = "bold fg"

[fossil_metrics]
# Lines added in the Fossil checkout
added_style = "success"
# Lines deleted in the Fossil checkout
deleted_style = "error"

[pijul_channel]
# The current Pijul channel
style = "bold fg"

[vcsh]
# The active vcsh repository
style = "fg"

# ---------------------------------------------------------------------------
# How the last command went
# ---------------------------------------------------------------------------

[cmd_duration]
# How long a long-running command took
style = "warning"

[status]
# The exit code of a command that failed
style = "bold error"

[jobs]
# Background jobs of this shell
style = "fg-muted"

[[battery.display]]
# A battery below the threshold
threshold = 10
style = "error"

# ---------------------------------------------------------------------------
# Who and where you are
# ---------------------------------------------------------------------------

[username]
# The current user
style_user = "fg-muted"
# The same field when that user is root
style_root = "bold error"

[hostname]
# The machine name, shown over SSH
style = "fg-muted"

[localip]
# The machine's LAN address
style = "fg-muted"

[os]
# The operating system glyph
style = "fg-muted"

[shell]
# Which shell is running
style = "fg-muted"

[shlvl]
# How deeply shells are nested
style = "fg-muted"

[sudo]
# Cached sudo credentials
style = "fg"

[memory_usage]
# Used memory and swap
style = "fg-faint"

[time]
# The clock
style = "fg-faint"

