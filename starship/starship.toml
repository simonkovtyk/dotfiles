# ---------------------------------------------------------------------------
# The palette
#
# Every color the theme uses, declared once and referenced by name above.
# The comment on each line is the shade it is taken from.
# ---------------------------------------------------------------------------

[palettes.dark-orchid]
accent = "#7300ff" # brand_500
on-accent = "#000000" # black
accent-bright = "#ab66ff" # brand_300 — deprecated — accent text takes `accent`
accent-lit = "#8f33ff" # brand_400
accent-dim = "#5c00cc" # brand_600
accent-peak = "#c799ff" # brand_200
accent-surface = "#2e0066" # brand_800
bg = "#09090b" # zinc_950
bg-alt = "#18181b" # zinc_900
surface = "#27272a" # zinc_800
border = "#3f3f46" # zinc_700
selection-muted = "#3f3f46" # zinc_700
fg-faint = "#52525b" # zinc_600
fg-muted = "#71717a" # zinc_500
fg = "#d4d4d8" # zinc_300
fg-strong = "#f4f4f5" # zinc_100
error = "#dc2626" # red_600
warning = "#ca8a04" # yellow_600
success = "#16a34a" # green_600
info = "#2563eb" # blue_600
