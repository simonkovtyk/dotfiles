; THE NAMES
;
; What each colour is for. These are the names a stylesheet should reach for —
; `--spice-fg-muted`, not `--spice-zinc-500` — so a surface can be re-pointed at
; a different stop in one place. A name repeats its stop's value because this
; format has no way for one key to refer to another.

; Accent — the one thing that is lit. Every one of these comes from the
; brand ramp and nowhere else: a selection, a playing track, a filled bar.
accent                 = 7300ff ; brand-500
on-accent              = 000000 ; black — any foreground sitting on the accent
accent-bright          = ab66ff ; brand-300 — deprecated — accent text takes `accent`
accent-lit             = 8f33ff ; brand-400 — the accent one step louder
accent-dim             = 5c00cc ; brand-600 — the accent one step quieter
accent-peak            = c799ff ; brand-200 — the loudest stop: peaks, a live indicator
accent-surface         = 2e0066 ; brand-800 — a background tinted by the accent

; Neutral — the greys that carry everything else, stacked darkest to lightest.
bg                     = 09090b ; zinc-950
bg-tinted              = 0c001a ; brand-950
bg-alt                 = 18181b ; zinc-900
surface                = 27272a ; zinc-800
border                 = 3f3f46 ; zinc-700
selection-muted        = 3f3f46 ; zinc-700 — a fill, where the accent is already spoken for
fg-faint               = 52525b ; zinc-600
fg-muted               = 71717a ; zinc-500
fg                     = d4d4d8 ; zinc-300
fg-strong              = f4f4f5 ; zinc-100
on-cursor              = 18181b ; zinc-900

; Status — a state the player has to report.
error                  = dc2626 ; red-600
warning                = ca8a04 ; yellow-600
success                = 16a34a ; green-600
info                   = 2563eb ; blue-600
hint                   = 71717a ; zinc-500
error-underline        = 7f1d1d ; red-900

; Depth — one gradient for nesting that has to stay legible. Take the stops in
; order and stop when whatever is being nested runs out.
depth-1                = ab66ff ; brand-300
depth-2                = a78bfa ; violet-400
depth-3                = c084fc ; purple-400
depth-4                = f0abfc ; fuchsia-300
depth-5                = f9a8d4 ; pink-300
depth-6                = 93c5fd ; blue-300

; Syntax — for anything that renders code or markup. These hues are not
; accents, so the brand rule does not reach them.
syn-comment            = 71717a ; zinc-500
syn-string             = 86efac ; green-300
syn-function           = 93c5fd ; blue-300
syn-keyword            = a78bfa ; violet-400
syn-type               = a5f3fc ; cyan-200
syn-storage            = c084fc ; purple-400
syn-property           = f0abfc ; fuchsia-300
syn-text               = d4d4d8 ; zinc-300
syn-tag                = f9a8d4 ; pink-300
syn-todo               = 60a5fa ; blue-400
syn-link               = 93c5fd ; blue-300


; THE ROLES
;
; The eighteen keys Spotify reads for itself. Everything above is ours to name;
; these are the client's, and it paints them whether or not a stylesheet asks.
; Leave one out and the stock green comes back in its place, so every one is
; set. The comment gives the name each takes from the block above.

text                   = d4d4d8 ; fg — track titles, headings, playlist names
subtext                = 71717a ; fg-muted — artist names, counts, the small print
main                   = 09090b ; bg — the main view behind everything
main-elevated          = 27272a ; surface — cards and panels lifted off the main view
highlight              = 18181b ; bg-alt — a row under the pointer
highlight-elevated     = 3f3f46 ; border — a card under the pointer
sidebar                = 18181b ; bg-alt — the library panel
player                 = 18181b ; bg-alt — the now playing bar
card                   = 27272a ; surface — a card at rest, and the player's outline
shadow                 = 000000 ; fallback: black — a drop shadow, which no name covers
selected-row           = d4d4d8 ; fg — see the README: the current client never reads this
button                 = 7300ff ; accent — play, like, and every other lit control
button-active          = 8f33ff ; accent-lit — the same control while it is pressed
button-disabled        = 3f3f46 ; border — the unfilled half of the seek and volume bars
tab-active             = 27272a ; surface — dialogs, inputs and the rules between sections
notification           = 27272a ; surface — a toast
notification-error     = dc2626 ; error — a toast that failed
misc                   = 71717a ; fg-muted — footnotes, separators and stray glyphs
