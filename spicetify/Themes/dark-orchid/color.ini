[dark-orchid]

; THE PALETTE
;
; Every colour that exists, named after its ramp and its stop. Nothing in the
; theme is blended, tinted or invented — it is one of these. Spotify turns each
; key below into a pair of custom properties, --spice-<key> and
; --spice-rgb-<key>, so every stop is reachable from a stylesheet by name.
; The comment on a stop names the job it does, or repeats the stop where it
; carries none of its own.

