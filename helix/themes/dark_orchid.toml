"ui.virtual.whitespace" = { fg = "zinc-700" }
"ui.virtual.indent-guide" = { fg = "zinc-700" }
"ui.virtual.inlay-hint" = { fg = "zinc-500", modifiers = ["italic"] }
"ui.virtual.inlay-hint.parameter" = { fg = "zinc-500", modifiers = ["italic"] }
"ui.virtual.inlay-hint.type" = { fg = "zinc-500", modifiers = ["italic"] }
"ui.virtual.wrap" = { fg = "zinc-700" }
"ui.virtual.jump-label" = { fg = "brand-500", modifiers = ["bold"] }

"ui.statusline" = { fg = "zinc-300" }
"ui.statusline.inactive" = { fg = "zinc-500" }
"ui.statusline.separator" = { fg = "zinc-700" }
# The status bar is left unpainted so the terminal background carries it.
# Helix tints the entire bar per mode rather than just a mode block, which
# drowns out every other accent, so the mode variants stay commented out.
# Uncomment them for a purple, mode-aware status bar:
# "ui.statusline.normal" = { fg = "black", bg = "brand-500", modifiers = ["bold"] }
# "ui.statusline.insert" = { fg = "black", bg = "brand-500", modifiers = ["bold"] }
# "ui.statusline.select" = { fg = "black", bg = "brand-500", modifiers = ["bold"] }

"ui.bufferline" = { fg = "zinc-500", modifiers = ["italic"] }
"ui.bufferline.active" = { fg = "black", bg = "brand-500", modifiers = ["italic"] }
"ui.bufferline.background" = { fg = "zinc-500" }

"ui.debug.breakpoint" = { fg = "red-600" }
"ui.debug.active" = { fg = "yellow-600" }

"tabstop" = { bg = "brand-800" }

# ---------------------------------------------------------------------------
# Palette
#
# The full ramps ship so a scope above can be retargeted by name instead of by
# hex value. The entries this theme actually uses carry the token they stand
# for; the rest are unused spares.
# ---------------------------------------------------------------------------

