# Released under the MIT License — see LICENSE at the repository root.

[themes.dark_orchid]

# The symbol marking the default device on the Input/Output Devices tabs
default_device = { fg = "#7300ff" } # accent
# The symbol marking the default endpoint on the Playback/Recording tabs
default_stream = { fg = "#7300ff" } # accent

# The selection indicator in a tab
selector = { fg = "#8f33ff" } # accent-lit

# The name of a tab in the tab menu
tab = { fg = "#71717a" } # fg-muted
# The name of the selected tab in the tab menu
tab_selected = { fg = "#7300ff", add_modifier = "BOLD" } # accent
# The symbols surrounding the selected tab — the same accent, carried by the
# weight of the name rather than by a second color
tab_marker = { fg = "#7300ff" } # accent
# The symbol at the top/bottom of a tab indicating that there are more items
list_more = { fg = "#52525b" } # fg-faint

# The name of a PipeWire node
node_title = { fg = "#d4d4d8" } # fg
# The name of the selected target for a node
node_target = { fg = "#71717a" } # fg-muted

# The volume percentage label
volume = { fg = "#d4d4d8" } # fg
# Volume bar
volume_empty = { fg = "#3f3f46" } # border
volume_filled = { fg = "#8f33ff" } # accent-lit

# Peak meter. Inactive = unlit, active = lit, overload = greater than 0.0 dB
meter_inactive = { fg = "#3f3f46" } # border
meter_active = { fg = "#ab66ff" } # brand-300
meter_overload = { fg = "#dc2626" } # error
# The "live" indicator in the center of the meter
meter_center_inactive = { fg = "#3f3f46" } # border
meter_center_active = { fg = "#c799ff" } # accent-peak

# The name of a device in the Configuration tab
config_device = { fg = "#d4d4d8" } # fg
# The name of the selected profile in the Configuration tab
config_profile = { fg = "#7300ff" } # accent

# Dropdown marker next to the profiles in the Configuration tab
dropdown_icon = { fg = "#71717a" } # fg-muted
# Border around dropdowns
dropdown_border = { fg = "#3f3f46" } # border
# The name of an item in a dropdown
dropdown_item = { fg = "#d4d4d8" } # fg
# The name of the currently-selected item in a dropdown
dropdown_selected = { fg = "#000000", bg = "#7300ff", add_modifier = "BOLD" } # on-accent on accent
# The symbol at the top/bottom of a dropdown indicating that there are more
# items
dropdown_more = { fg = "#52525b" } # fg-faint

# Border around help menu
help_border = { fg = "#3f3f46" } # border
# The name of an item in the help menu
help_item = { fg = "#d4d4d8" } # fg
# The symbol at the top/bottom of the help menu indicating that there are more
# items
help_more = { fg = "#52525b" } # fg-faint

# vim: ft=toml
