"ui.cursor" = { fg = "zinc-900", bg = "zinc-300" }

"ui.selection" = { bg = "zinc-800" }
"ui.selection.primary" = { bg = "zinc-700" }

"ui.highlight" = { bg = "zinc-700" }
"ui.highlight.frameline" = { bg = "brand-800" }

"ui.virtual" = { fg = "zinc-700" }
