# THE TOKENS
#
# What the colours above are *for*. Write a lock screen in these and it stays
# in step when a stop moves: each one points at a stop rather than repeating
# its value.

# Accent — the one thing that is lit. Every one of these is brand, and
# nothing else on the screen may be purple.
$accent                  = $brand_500 # accent
$on_accent               = $black          # on-accent
$accent_bright           = $brand_300 # deprecated — accent text takes `accent`
$accent_lit              = $brand_400 # accent-lit
$accent_dim              = $brand_600 # accent-dim
$accent_peak             = $brand_200 # accent-peak
$accent_surface          = $brand_800 # accent-surface

# Neutral — the greys that carry everything else, stacked darkest to lightest.
# A surface that has to differ from its neighbour moves along this ramp.
$bg                      = $zinc_950       # bg
$bg_tinted               = $brand_950 # bg-tinted
$bg_alt                  = $zinc_900       # bg-alt
$surface                 = $zinc_800       # surface
$border                  = $zinc_700       # border
$selection_muted         = $zinc_700       # selection-muted
$fg_faint                = $zinc_600       # fg-faint
$fg_muted                = $zinc_500       # fg-muted
$fg                      = $zinc_300       # fg
$fg_strong               = $zinc_100       # fg-strong
$on_cursor               = $zinc_900       # on-cursor

# Status — a state the screen has to report: a wrong password, a lock key, a
# prompt that succeeded. Move up the same hue to the 300 stop where one of
# these has to be readable running text.
$error                   = $red_600        # error
$warning                 = $yellow_600     # warning
$success                 = $green_600      # success
$info                    = $blue_600       # info
$hint                    = $zinc_500       # hint
$error_underline         = $red_900        # error-underline

# Depth — one gradient for nesting that has to stay legible. Take the stops in
# order and stop when the layout runs out of levels.
$depth_1                 = $brand_300 # depth-1
$depth_2                 = $violet_400     # depth-2
$depth_3                 = $purple_400     # depth-3
$depth_4                 = $fuchsia_300    # depth-4
$depth_5                 = $pink_300       # depth-5
$depth_6                 = $blue_300       # depth-6

# Overlay — the translucent tokens, for a backing under text that would
# otherwise sit on an arbitrary photograph. These are the only tokens that
# write a value out: hyprlang cannot lift the channels back out of a colour it
# already holds, so an opacity cannot be applied to one.
$overlay_hover           = rgba(7300ff24)  # overlay-hover — accent at 14%
$overlay_active          = rgba(7300ff3d)  # overlay-active — accent at 24%
$scrim                   = rgba(09090b8c)  # scrim — bg at 55%
$scrim_strong            = rgba(09090bcc)  # scrim-strong — bg at 80%
$bg_translucent          = rgba(09090bd9)  # bg-translucent — bg at 85%

# Syntax — for a label that renders code or markup, which on a lock screen is
# rare but cheap to have. These hues are not accents.
$syn_comment             = $zinc_500       # syn-comment
$syn_string              = $green_300      # syn-string
$syn_function            = $blue_300       # syn-function
$syn_keyword             = $violet_400     # syn-keyword
$syn_type                = $cyan_200       # syn-type
$syn_storage             = $purple_400     # syn-storage
$syn_property            = $fuchsia_300    # syn-property
$syn_text                = $zinc_300       # syn-text
$syn_tag                 = $pink_300       # syn-tag
$syn_todo                = $blue_400       # syn-todo
$syn_link                = $blue_300       # syn-link

# THE SAME TOKENS AS PANGO MARKUP
#
# A `<span foreground=…>` inside a label, a placeholder or a failure message
# takes a bare hex triplet, not an `rgb()` value, so every opaque token is
# declared a second time in that form. Write it as `##$name` — a lone `#`
# starts a comment.
#
# Two things are deliberately absent. The overlay tokens have none, because a
# pango colour attribute holds no alpha channel; reach for `alpha=` beside it
# if a span needs one. The palette stops have none either, because a triplet
# per stop would double this file for a colour a span can already carry by
# name through the token that points at it.
$accent_markup           = 7300ff          # accent
$on_accent_markup        = 000000          # on-accent
$accent_bright_markup    = ab66ff          # deprecated — accent text takes `accent`
$accent_lit_markup       = 8f33ff          # accent-lit
$accent_dim_markup       = 5c00cc          # accent-dim
$accent_peak_markup      = c799ff          # accent-peak
$accent_surface_markup   = 2e0066          # accent-surface
$bg_markup               = 09090b          # bg
$bg_tinted_markup        = 0c001a          # bg-tinted
$bg_alt_markup           = 18181b          # bg-alt
$surface_markup          = 27272a          # surface
$border_markup           = 3f3f46          # border
$selection_muted_markup  = 3f3f46          # selection-muted
