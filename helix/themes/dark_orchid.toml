"ui.text.directory" = "zinc-300"

"ui.window" = { fg = "zinc-700" }
"ui.help" = { fg = "zinc-300" }
"ui.popup" = { fg = "zinc-300" }
"ui.popup.info" = { fg = "zinc-300" }

"ui.menu" = { fg = "zinc-300" }
"ui.menu.selected" = { fg = "black", bg = "brand-500" }
"ui.menu.scroll" = { fg = "zinc-500", bg = "zinc-800" }

"ui.picker.header" = { fg = "zinc-500" }
"ui.picker.header.column" = { fg = "zinc-500" }
"ui.picker.header.column.active" = { fg = "zinc-300", modifiers = ["bold"] }

"ui.linenr" = { fg = "zinc-700" }
"ui.linenr.selected" = { fg = "zinc-500" }
"ui.gutter" = { fg = "zinc-700" }
