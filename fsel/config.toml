# [section]. The dmenu and clipboard modes take them too.

# The entry under the cursor, and the cursor in the input.
highlight_color = "#7300ff" # accent

# Panel titles, and the mark beside a pinned app.
header_title_color = "#7300ff" # accent
pin_color = "#7300ff" # accent

main_border_color = "#3f3f46" # border
apps_border_color = "#3f3f46" # border
input_border_color = "#3f3f46" # border

main_text_color = "#d4d4d8" # fg
apps_text_color = "#d4d4d8" # fg
input_text_color = "#d4d4d8" # fg
