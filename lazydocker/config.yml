gui:
  theme:
    # The border and title of the panel you are in
    activeBorderColor: ["#7300ff", "bold"] # accent

    # Every other panel border
    inactiveBorderColor: ["#3f3f46"] # border

    # The line under the cursor, in every list and menu
    selectedLineBgColor: ["#7300ff"] # accent

    # The keybinding hints along the bottom line
    optionsTextColor: ["#71717a"] # fg-muted
