# vim:ft=kitty

## name: Dark Orchid
## author: The Dark Orchid Maintainers
## license: MIT
## blurb: A dark, monochrome theme, and it is purple. Greys carry the whole
## interface; a single purple carries every selection and active state, so the
## thing you are pointing at is the only thing lit.

# Dark Orchid — a kitty theme
#
# Copyright (c) 2026 — present by The Dark Orchid Maintainers
# Released under the MIT License — see LICENSE at the repository root.


#: The basic colors

# fg
foreground              #d4d4d8
# bg
background              #09090b
# bg-translucent — bg at 85%, since a color value here carries no alpha
background_opacity      0.85


#: Selection

# on-accent
selection_foreground    #000000
# accent
selection_background    #7300ff


#: Cursor

# fg
cursor                  #d4d4d8
# on-cursor
cursor_text_color       #18181b
# unset — the trail takes the cursor color
cursor_trail_color      none


#: URL underline color when hovering with mouse

# accent
url_color               #7300ff


#: Window border colors and terminal bell colors

# accent
active_border_color     #7300ff
# border
inactive_border_color   #3f3f46
# error
bell_border_color       #dc2626
# error
visual_bell_color       #dc2626


#: OS window titlebar colors

# the titlebar follows the window background
wayland_titlebar_color  background
macos_titlebar_color    background


#: Tab bar colors

# on-accent
active_tab_foreground   #000000
# accent
active_tab_background   #7300ff
# fg-muted
inactive_tab_foreground #71717a
# bg-alt
inactive_tab_background #18181b
# unset — the bar takes the window background, and its transparency with it
tab_bar_background      none
# unset — the margins take the window background
tab_bar_margin_color    none


#: Colors for marks (marked text in the terminal)

# on-accent on accent
mark1_foreground        #000000
mark1_background        #7300ff
# on-accent on accent-lit
mark2_foreground        #000000
mark2_background        #8f33ff
# on-accent on brand-300
mark3_foreground        #000000
mark3_background        #ab66ff


#: The basic 16 colors — each pair is the normal slot and its bright twin

# bg-alt — black
color0                  #18181b
color8                  #18181b

# error — red
color1                  #dc2626
color9                  #dc2626

# success — green
color2                  #16a34a
color10                 #16a34a

# warning — yellow
color3                  #ca8a04
color11                 #ca8a04

# info — blue
color4                  #2563eb
color12                 #2563eb

# fallback: pink-600 — magenta
color5                  #db2777
color13                 #db2777

# fallback: cyan-600 — cyan
color6                  #0891b2
color14                 #0891b2

# fg — white
color7                  #d4d4d8
color15                 #d4d4d8
