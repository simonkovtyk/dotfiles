[[language-server.json.config.json.schemas]]
fileMatch = [".oxfmtrc.json", ".oxfmtrc.jsonc"]
url = "https://raw.githubusercontent.com/oxc-project/oxc/main/npm/oxfmt/configuration_schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["biome.json", "biome.jsonc"]
url = "https://biomejs.dev/schemas/latest/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".eslintrc", ".eslintrc.json"]
url = "https://json.schemastore.org/eslintrc.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".stylelintrc", ".stylelintrc.json"]
url = "https://json.schemastore.org/stylelintrc.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".markdownlint.json", ".markdownlint.jsonc", ".markdownlintrc"]
url = "https://raw.githubusercontent.com/DavidAnson/markdownlint/main/schema/markdownlint-config-schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".babelrc", ".babelrc.json", "babel.config.json"]
url = "https://json.schemastore.org/babelrc.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".lintstagedrc", ".lintstagedrc.json"]
url = "https://json.schemastore.org/lintstagedrc.schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".commitlintrc", ".commitlintrc.json"]
url = "https://json.schemastore.org/commitlintrc.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".releaserc", ".releaserc.json"]
url = "https://json.schemastore.org/semantic-release.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".changeset/config.json"]
url = "https://unpkg.com/@changesets/config/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["knip.json", "knip.jsonc", ".knip.json", ".knip.jsonc"]
url = "https://unpkg.com/knip@5/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["typedoc.json"]
url = "https://typedoc.org/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["nodemon.json"]
url = "https://json.schemastore.org/nodemon.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["lerna.json"]
url = "https://json.schemastore.org/lerna.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["nx.json"]
url = "https://raw.githubusercontent.com/nrwl/nx/master/packages/nx/schemas/nx-schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["project.json"]
url = "https://raw.githubusercontent.com/nrwl/nx/master/packages/nx/schemas/project-schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["manifest.json", "site.webmanifest", "manifest.webmanifest"]
url = "https://json.schemastore.org/web-manifest-combined.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["devcontainer.json", ".devcontainer.json"]
url = "https://raw.githubusercontent.com/devcontainers/spec/main/schemas/devContainer.schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["firebase.json"]
url = "https://raw.githubusercontent.com/firebase/firebase-tools/master/schema/firebase-config.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["composer.json"]
url = "https://getcomposer.org/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".claude/settings.json", ".claude/settings.local.json"]
url = "https://json.schemastore.org/claude-code-settings.json"

[language-server.tombi]
command = "tombi"
args = ["lsp"]

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

[language-server.bash-language-server.config]
bashIde = { shellcheckPath = "" }

[language-server.cssmodules]
command = "cssmodules-language-server"

[language-server.hx-lsp]
command = "hx-lsp"

[language-server.emmet]
command = "emmet-language-server"
args = ["--stdio"]

[[language]]
name = "rust"
file-types = ["rs"]
language-servers = ["rust", { name = "hx-lsp", only-features = ["completion"] }]
roots = ["Cargo.toml", "Cargo.lock"]

[[language]]
name = "go"
file-types = ["go", "gomod", "gowork", "gotmpl"]
language-servers = ["go", { name = "hx-lsp", only-features = ["completion"] }]
roots = ["go.work", "go.mod"]

[[language]]
name = "lua"
file-types = ["lua"]
language-servers = ["lua", { name = "hx-lsp", only-features = ["completion"] }]

[[language]]
name = "markdown"
file-types = ["md", "mdx"]
language-servers = ["markdown", { name = "hx-lsp", only-features = ["completion"] }]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "ansible"
scope = "source.yaml"
file-types = [
  { glob = "**/playbooks/*.yml" },
  { glob = "**/playbooks/*.yaml" },
  { glob = "**/roles/**/*.yml" },
  { glob = "**/roles/**/*.yaml" },
  { glob = "*playbook*.yml" },
  { glob = "*playbook*.yaml" },
]
language-servers = ["ansible"]

[[language]]
name = "python"
file-types = ["py"]
language-servers = ["python", { name = "hx-lsp", only-features = ["completion"] }]

[[language]]
name = "svelte"
file-types = ["svelte"]
language-servers = ["svelte", { name = "hx-lsp", only-features = ["completion"] }, "tailwind", "emmet"]
roots = ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "tsconfig.json"]

[[language]]
name = "systemd"
file-types = [
  "service",
  "socket",
  "timer",
  "mount",
  "automount",
  "swap",
  "target",
  "path",
  "slice",
  "scope",
  "device",
  "container",
  "volume",
  "network",
  "kube",
  "pod",
  "build",
  "image",
]
language-servers = ["systemd"]

[[language]]
name = "vue"
file-types = ["vue"]
language-servers = ["vue", "tailwind", "emmet"]
roots = ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", "vue.config.ts"]
auto-format = true

[[language]]
name = "typescript"
file-types = ["ts", "mts", "cts"]
language-servers = [
  { name = "tsc", except-features = [
    "format",
  ] },
  { name = "hx-lsp", only-features = [
    "completion",
  ] },
  { name = "oxlint", only-features = [
    "diagnostics",
    "code-action",
  ] },
]
roots = ["package.json", "tsconfig.json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "javascript"
file-types = ["js", "mjs", "cjs"]
language-servers = [
  { name = "tsc", except-features = [
    "format",
  ] },
  { name = "hx-lsp", only-features = [
    "completion",
  ] },
  { name = "oxlint", only-features = [
    "diagnostics",
    "code-action",
  ] },
]
roots = ["package.json", "jsconfig.json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "tsx"
file-types = ["tsx", "mtsx", "ctsx"]
language-servers = [
  { name = "tsc", except-features = [
    "format",
  ] },
  { name = "hx-lsp", only-features = [
    "completion",
  ] },
  "tailwind",
  "emmet",
  "cssmodules",
  { name = "oxlint", only-features = [
    "diagnostics",
    "code-action",
  ] },
]
roots = ["package.json", "tsconfig.json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "jsx"
file-types = ["jsx", "mjsx", "cjsx"]
language-servers = [
  { name = "tsc", except-features = [
    "format",
  ] },
  { name = "hx-lsp", only-features = [
    "completion",
  ] },
  "tailwind",
  "emmet",
  "cssmodules",
  { name = "oxlint", only-features = [
    "diagnostics",
    "code-action",
  ] },
]
roots = ["package.json", "jsconfig.json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "latex"
file-types = ["tex", "plaintex", "bib"]
language-servers = ["latex", { name = "hx-lsp", only-features = ["completion"] }]

[[language]]
name = "css"
file-types = ["css", "less"]
language-servers = ["css", { name = "hx-lsp", only-features = ["completion"] }, "tailwind", "emmet"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "html"
file-types = ["html", "htm"]
language-servers = ["html", { name = "hx-lsp", only-features = ["completion"] }, "tailwind", "emmet"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "json"
file-types = ["json"]
language-servers = ["json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "scss"
file-types = ["scss", "sass"]
language-servers = ["css", "tailwind", "emmet"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "yaml"
file-types = ["yaml", "yml"]
language-servers = ["yaml"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "toml"
file-types = ["toml"]
language-servers = ["tombi"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "jsonc"
language-servers = ["json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "json5"
language-servers = ["json"]
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }
auto-format = true
