source = ./dark-orchid.conf

$font = Monospace

general {
    hide_cursor        = true
    ignore_empty_input = true
}

# The screen you locked, blurred and dimmed, is the backdrop. `color` is only
# ever painted when there is no image to blur — a headless session, or a
# `path` that does not resolve.
background {
    monitor           =
    path              = screenshot
    blur_passes       = 3
    blur_size         = 8
    noise             = 0.0117
    contrast          = 0.92
    brightness        = 0.55
    vibrancy          = 0.1686
    vibrancy_darkness = 0.05
    color             = $bg              # bg
    zindex            = -1
}

# A scrim panel behind the field and its hint. Over a blurred photograph the
# background is whatever you happened to be looking at, so the text that has to
# stay readable gets its own backing rather than a solid window.
shape {
    monitor       =
    size          = 480, 150
    position      = 0, -20
    halign        = center
    valign        = center
    rounding      = 16
    border_size   = 1
    border_color  = $border              # border
    color         = $scrim               # scrim
    shadow_size   = 14
    shadow_passes = 2
    shadow_color  = $scrim_strong        # scrim-strong
    zindex        = 0
}

# Your avatar, if you have one. hyprlock logs and skips the widget when the
# path does not resolve.
image {
    monitor      =
    path         = ~/.face
    size         = 84
    rounding     = -1
    border_size  = 2
    border_color = $accent               # accent
    position     = 0, 300
    halign       = center
    valign       = center
    zindex       = 1
}

# TIME
label {
    monitor       =
    text          = $TIME
    color         = $fg                  # fg
    font_size     = 92
    font_family   = $font
    position      = 0, 190
    halign        = center
    valign        = center
    shadow_size   = 6
    shadow_passes = 2
    shadow_color  = $scrim_strong        # scrim-strong
    zindex        = 1
}

# DATE
label {
    monitor       =
    text          = cmd[update:60000] date +"%A, %d %B %Y"
    color         = $fg_muted            # fg-muted
    font_size     = 20
    font_family   = $font
    position      = 0, 120
    halign        = center
    valign        = center
    shadow_size   = 4
    shadow_passes = 2
    shadow_color  = $scrim_strong        # scrim-strong
    zindex        = 1
}

# The outline is the one lit thing on the screen, and it is what carries the
# field's state: purple at rest, a step brighter while the password is being
# checked, red when it was wrong, and the two lock keys in their status colours.
input-field {
    monitor               =
    size                  = 360, 56
    position              = 0, 0
    halign                = center
    valign                = center
    outline_thickness     = 2
    rounding              = 10
    dots_size             = 0.24
    dots_spacing          = 0.3
    dots_center           = true
    dots_rounding         = -1
    fade_on_empty         = false
    hide_input            = false
    font_family           = $font

    inner_color           = $scrim_strong          # scrim-strong
    outer_color           = $accent                # accent
    font_color            = $fg                    # fg
    check_color           = $accent_lit            # accent-lit
    fail_color            = $error                 # error
    capslock_color        = $warning               # warning
    numlock_color         = $info                  # info
    bothlock_color        = $warning $info 45deg   # warning into info
    hide_input_base_color = $accent                # accent

    placeholder_text      = <span foreground="##$fg_muted_markup"><i>Locked as </i></span><span foreground="##$accent_markup">$USER</span>
    check_text            = <i>Checking…</i>
    fail_text             = <i>$FAIL</i> <span foreground="##$fg_muted_markup">($ATTEMPTS)</span>

    shadow_size           = 8
    shadow_passes         = 2
    shadow_color          = $scrim_strong          # scrim-strong
    zindex                = 2
}

# Whatever the authentication backend is asking for right now.
label {
    monitor     =
    text        = $PAMPROMPT
    color       = $fg_muted              # fg-muted
    font_size   = 13
    font_family = $font
    position    = 0, -58
    halign      = center
    valign      = center
    zindex      = 2
}

# The keyboard layout, parked in the corner where it can be checked but does
# not compete with anything.
label {
    monitor     =
    text        = $LAYOUT
    color       = $fg_faint              # fg-faint
    font_size   = 14
    font_family = $font
    position    = -28, -24
    halign      = right
    valign      = top
    zindex      = 1
}
