# The colour each line sets is named above it rather than beside it: a comment
# after a value is read as part of the value. Triples are decimal r,g,b, which
# is the only truecolor form this format takes.

# The file path heading above each group of matches.
# accent — #7300ff
--colors=path:fg:115,0,255
--colors=path:style:bold

# The line number.
# fg-muted — #71717a
--colors=line:fg:113,113,122

# The column number, printed only with --column, and quieter than the line it
# belongs to.
# fg-faint — #52525b
--colors=column:fg:82,82,91

# The match itself. Everything else is grey, so this is the one thing lit: the
# accent carrying it as a fill, with black on top.
# on-accent — #000000
--colors=match:fg:0,0,0
# accent — #7300ff
--colors=match:bg:115,0,255
--colors=match:style:bold

# The rest of a line that contains a match. Lifting it above the terminal's own
# foreground is what sets it apart from the context lines around it.
# fg-strong — #f4f4f5
--colors=highlight:fg:244,244,245
