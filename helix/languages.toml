[language-server.rust]
command = "rust-analyzer"

[language-server.rust.config]
procMacro.enable = true
checkOnSave = true
cargo.features = "all"
cargo.buildScripts.enable = false

[language-server.go]
command = "gopls"

[language-server.latex]
command = "texlab"

[language-server.ansible]
command = "ansible-language-server"
args = ["--stdio"]

[language-server.ansible.config]
ansible = { path = "ansible" }
python = { interpreterPath = "python" }
executionEnvironment = { enabled = false }
validation = { enabled = true, lint = { enabled = true } }

[language-server.lua]
command = "lua-language-server"

[language-server.markdown]
command = "marksman"
args = ["server"]

[language-server.python]
command = "ty"
args = ["server"]

[language-server.svelte]
command = "svelteserver"
args = ["--stdio"]

[language-server.systemd]
command = "systemd-lsp"

[language-server.vue]
command = "vue-language-server"
args = ["--stdio"]

[language-server.vue.config]
typescript = { tsdk = "/usr/lib/node_modules/typescript/lib" }

[language-server.yaml]
command = "yaml-language-server"
args = ["--stdio"]

[language-server.yaml.config]
redhat = { telemetry = { enabled = false } }

[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.tsc.config."js/ts"]
preferences.quoteStyle = "double"
preferences.importModuleSpecifier = "shortest"
preferences.importModuleSpecifierEnding = "auto"
preferences.jsxAttributeCompletionStyle = "auto"
preferences.preferTypeOnlyAutoImports = true
preferences.useAliasesForRenames = true
preferences.autoImportSpecifierExcludeRegexes = [
  '^@mui/[^/]+$',
  '^@base-ui/react$',
  '^@base-ui-components/react$',
  '^es-toolkit$',
  '^lodash$',
  '^lodash-es$',
  '^date-fns$',
  '^date-fns/locale$',
  '^ramda$',
  '^react-bootstrap$',
  '^primereact$',
  '^@fortawesome/free-(solid|regular|brands)-svg-icons$',
  '^react-use$',
  '^lucide-svelte$',
  '^@lucide/svelte$',
  '^phosphor-svelte$',
  '^@ant-design/icons$',
  '^@react-icons/all-files/[^/]+$',
  '^@styled-icons/[^/]+$',
  '^@iconify/icons-[^/]+$',
  '^@ark-ui/(react|svelte)$',
  '^@heroui/react$',
  '^@nextui-org/react$',
  '^@visx/visx$',
  '^effect$',
  '^fp-ts$',
  '^lodash/fp$',
  '^validator$',
]
preferences.organizeImports.typeOrder = "auto"
suggest.autoImports = true
suggest.includeCompletionsForImportStatements = true
suggest.includeAutomaticOptionalChainCompletions = true
suggest.classMemberSnippets.enabled = true
suggest.objectLiteralMethodSnippets.enabled = true
suggest.jsdoc.enabled = true
suggest.jsdoc.generateReturns = true
format.enabled = false
validate.enabled = true
autoClosingTags.enabled = true
reportStyleChecksAsWarnings = true
workspaceSymbols.excludeLibrarySymbols = true
tsserver.automaticTypeAcquisition.enabled = true
inlayHints.parameterNames.enabled = "none"
inlayHints.parameterTypes.enabled = false
inlayHints.variableTypes.enabled = false
inlayHints.propertyDeclarationTypes.enabled = false
inlayHints.functionLikeReturnTypes.enabled = false
inlayHints.enumMemberValues.enabled = false
referencesCodeLens.enabled = false
implementationsCodeLens.enabled = false

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[language-server.tailwind]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.tailwind.config.tailwindCSS]
classFunctions = ["cn", "cx", "cva", "clsx", "tv", "twMerge", "twJoin", "tw"]
classAttributes = ["class", "className", "class:list", "classList", "classes"]
emmetCompletions = true
showPixelEquivalents = true
rootFontSize = 16
colorDecorators = true
validate = true

[language-server.tailwind.config.tailwindCSS.lint]
cssConflict = "warning"
recommendedVariantOrder = "warning"
invalidApply = "error"
invalidVariant = "error"
invalidTailwindDirective = "error"
invalidConfigPath = "error"
suggestCanonicalClasses = "warning"

[language-server.css]
command = "vscode-css-language-server"
args = ["--stdio"]

[language-server.html]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.json]
command = "vscode-json-language-server"
args = ["--stdio"]

[language-server.json.config]
provideFormatter = false
json.validate.enable = true

[[language-server.json.config.json.schemas]]
fileMatch = ["package.json"]
url = "https://json.schemastore.org/package.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["tsconfig.json", "tsconfig.*.json"]
url = "https://json.schemastore.org/tsconfig.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["jsconfig.json", "jsconfig.*.json"]
url = "https://json.schemastore.org/jsconfig.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".oxlintrc.json"]
url = "https://raw.githubusercontent.com/oxc-project/oxc/main/npm/oxlint/configuration_schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".prettierrc", ".prettierrc.json"]
url = "https://json.schemastore.org/prettierrc.json"

[[language-server.json.config.json.schemas]]
fileMatch = [".swcrc"]
url = "https://swc.rs/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["turbo.json"]
url = "https://turbo.build/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["vercel.json"]
url = "https://openapi.vercel.sh/vercel.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["components.json"]
url = "https://ui.shadcn.com/schema.json"

[[language-server.json.config.json.schemas]]
fileMatch = ["renovate.json", ".renovaterc", ".renovaterc.json"]
