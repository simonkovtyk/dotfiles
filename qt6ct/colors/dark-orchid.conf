[ColorScheme]

; active_colors — the colours of the window that has focus.
;
; One line per role, in the order Qt fixes for them. A value line cannot carry
; a trailing comment — the parser ends the line at the first ';' — so the token
; each colour stands for is named here, against the line it belongs to.
;
;   1  WindowText       fg
;   2  Button           surface
;   3  Light            fallback: zinc-600
;   4  Midlight         border
;   5  Dark             bg
;   6  Mid              bg-alt
;   7  Text             fg
;   8  BrightText       fg-strong
;   9  ButtonText       fg
;  10  Base             bg-alt
;  11  Window           bg
;  12  Shadow           fallback: black
;  13  Highlight        accent
;  14  HighlightedText  on-accent
;  15  Link             accent
;  16  LinkVisited      accent-dim
;  17  AlternateBase    surface
;  18  NoRole           bg                         (Qt never paints with it)
;  19  ToolTipBase      bg-alt
;  20  ToolTipText      fg
;  21  PlaceholderText  fg-muted
;  22  Accent           accent
;
