fps = 60
mouse = false
tab = "playback"
char_set = "dark_orchid"
theme = "dark_orchid"

[char_sets.dark_orchid]
inherit = "default"
dropdown_border = "Rounded"
help_border = "Rounded"
dropdown_selector = " "
volume_empty = "─"
tab_marker_left = " "
tab_marker_right = " "
selector_top = " "
selector_middle = "󰅂"
selector_bottom = " "

# Dark Orchid — a wiremix theme
#
