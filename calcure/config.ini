calcurse_events_file = ~/.local/share/calcurse/apts
log_file = ~/.config/calcure/info.log
language = en
default_view = calendar
default_calendar_view = monthly
birthdays_from_abook = Yes
show_keybindings = Yes
privacy_mode = No
show_weather = No
weather_city =
weather_metric_units = Yes
minimal_today_indicator = Yes
minimal_days_indicator = Yes
minimal_weekend_indicator = Yes
show_calendar_borders = No
show_moon_phases = No
cut_titles_by_cell_length = No
ask_confirmations = Yes
ask_confirmation_to_quit = Yes
use_unicode_icons = Yes
show_current_time = No
show_holidays = Yes
show_nothing_planned = Yes
one_timer_at_a_time = No
holiday_country = UnitedStates
use_persian_calendar = No
start_week_day = 1
weekend_days = 6,7
refresh_interval = 1
data_reload_interval = 0
split_screen = Yes
right_pane_percentage = 25
journal_header = JOURNAL
event_icon = •
privacy_icon = •
today_icon = •
birthday_icon = ★
holiday_icon = ⛱
hidden_icon = ...
done_icon = ✔
todo_icon = •
important_icon = ‣
separator_icon = │
deadline_icon = ⚑

# Dark Orchid — a calcure theme
#
# Copyright (c) 2026 — present by The Dark Orchid Maintainers
# Released under the MIT License — see LICENSE at the repository root.

# calcure takes xterm-256 color numbers and nothing else, so every color is the
# fixed xterm color nearest to its role; the comment above each number names
# the role and the color it actually shows. -1 is the terminal's own color.
# Comments sit on their own lines because calcure reads everything after the
# = as the number.

[Colors]
# the terminal's own foreground and background
color_foreground = -1
color_background = -1

# : Calendar {{{

# accent #5f00ff — today
color_today = 57
# accent #5f00ff — the month above the calendar
color_calendar_header = 57
# fg #d7d7d7
color_days = 188
# fg-muted #767676
color_weekends = 243
# fg-muted #767676
color_day_names = 243
# fg-faint #4e4e4e
color_weekend_names = 239
# fg #d7d7d7
color_events = 188
# fg-strong #eeeeee
color_birthdays = 255
# fg-muted #767676
color_holidays = 243
# fg-muted #767676
color_holidays_date = 243
# border #444444
color_calendar_border = 238
# One per calendar you import, told apart by the depth gradient:
# depth-1 #af5fff, depth-2 #af87ff, depth-4 #ffafff, depth-5 #ffafd7, depth-6 #afd7ff
color_ics_calendars = 135,141,219,218,153,135,141,219,218,153

# : }}}

# : Tasks {{{

# fg #d7d7d7
color_todo = 188
# fg-faint #4e4e4e
color_done = 239
# accent #5f00ff — a task marked important
color_important = 57
# fg-faint #4e4e4e
color_unimportant = 239
# warning #d78700
color_deadlines = 172
# success #00af5f — a timer that is running
color_timer = 35
# fg-muted #767676
color_timer_paused = 243

# : }}}

# : Interface {{{

# accent #5f00ff — the pane you are in
color_active_pane = 57
# accent #5f00ff
color_title = 57
# fg-muted #767676
color_hints = 243
# accent #5f00ff
color_prompts = 57
# warning #d78700 — "are you sure?"
color_confirmations = 172
# border #444444
color_separator = 238
# fg-muted #767676
color_time = 243
# fg-muted #767676
color_weather = 243

# : }}}

[Styles]
bold_today = No
