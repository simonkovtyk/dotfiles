# THE PALETTE
#
# Every colour that exists, named after its ramp and its stop. Nothing outside
# this block belongs on a lock screen: no blended shade, no hue of its own.
# A variable name holds no `-`, so a name here carries `_` wherever the family's
# own spelling carries `-`; they map back one for one. Reach into a stop
# directly only where no token in the next block fits the job — the comment on a
# stop names the tokens it carries, or spells the stop out where it carries
# none.

